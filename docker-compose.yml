name: fake-review-detection
services:
  namenode:
    build:
      context: .
      dockerfile: docker/hadoop/Dockerfile
      args:
        PROXY_CA_CERT: ${PROXY_CA_CERT:-}
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports: ["9870:9870", "9000:9000"]
    volumes: ["namenode-data:/hadoop/dfs/name"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9870/jmx >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
  datanode:
    build:
      context: .
      dockerfile: docker/hadoop/Dockerfile
      args:
        PROXY_CA_CERT: ${PROXY_CA_CERT:-}
    hostname: datanode
    command: ["hdfs", "datanode"]
    ports: ["9864:9864"]
    volumes: ["datanode-data:/hadoop/dfs/data"]
    mem_limit: 1024m
    depends_on:
      namenode: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9864/jmx >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  resourcemanager:
    build:
      context: .
      dockerfile: docker/hadoop/Dockerfile
      args:
        PROXY_CA_CERT: ${PROXY_CA_CERT:-}
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports: ["8088:8088"]
    mem_limit: 768m
    depends_on:
      namenode: { condition: service_healthy }
  nodemanager:
    build:
      context: .
      dockerfile: docker/hadoop/Dockerfile
      args:
        PROXY_CA_CERT: ${PROXY_CA_CERT:-}
    hostname: nodemanager
    command: ["yarn", "nodemanager"]
    ports: ["8042:8042"]
    mem_limit: 2048m
    depends_on:
      namenode: { condition: service_healthy }
      resourcemanager: { condition: service_started }
    volumes:
      - "yarn-local:/tmp/hadoop-yarn"
      - "./backend/app/bigdata/jobs:/opt/jobs:ro"
  spark-client:
    build:
      context: .
      dockerfile: docker/hadoop/Dockerfile
      args:
        PROXY_CA_CERT: ${PROXY_CA_CERT:-}
    hostname: spark-client
    command: ["sleep", "infinity"]
    environment:
      HADOOP_USER_NAME: hadoop
      SPARK_LOCAL_IP: 0.0.0.0
    mem_limit: 1024m
    depends_on:
      namenode: { condition: service_healthy }
      datanode: { condition: service_healthy }
      resourcemanager: { condition: service_started }
    volumes:
      - "./backend/data:/workspace/data"
      - "./backend/app/bigdata/jobs:/opt/jobs:ro"
volumes:
  namenode-data:
  datanode-data:
  yarn-local:
